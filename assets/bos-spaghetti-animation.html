<title id="title">From spaghetti code to a little more order, with BOS</title><desc id="desc">A 1960s dark-brown pen-and-ink drawing on aged paper. A typist feeds a vintage pasta machine. A wild tangle of code flies into the air and loops across the typewriter and the typist, whose hair stands on end. A clearly visible BOS device plugs in; the hair relaxes and the strands settle into orderly rows.</desc>

<div class="controls"><span>An illustrated take on keeping AI development on track.</span><button id="toggle" type="button" aria-label="Pause animation">Pause</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
for(let row=0;row<3;row++)for(let col=0;col<9;col++){const k=document.createElementNS(ns,'circle');k.setAttribute('cx',202+col*9+row*-3);k.setAttribute('cy',244+row*7);k.setAttribute('r',2.6);$('keys').appendChild(k);}
// Each strand has its own loops; three thin flyaways cross the actors without hiding them.
const strandCount=10,flyawayCount=3,curveCount=8;
const paths=Array.from({length:strandCount+flyawayCount},(_,i)=>{const p=document.createElementNS(ns,'path');p.setAttribute('stroke','#503620');p.setAttribute('stroke-width',i<strandCount?1.1+(i%3)*.35:1.15);$('strands').appendChild(p);return p;});
const random=(i,k)=>{const v=Math.sin((i+1)*127.1+(k+1)*311.7)*43758.5453;return v-Math.floor(v);};
const tangles=paths.map((_,i)=>{
 const v=[508,208+i%5*2];
 if(i<strandCount){
  // Alternating tightly folded loops, high arcs and low knots; never parallel ribbons.
  const knots=[[570,198],[660,104],[797,203],[709,302],[592,246],[758,154],[812,310],[687,328]];
  knots.forEach(([x,y],j)=>{const side=(i+j)%2?1:-1,px=v[v.length-2],py=v[v.length-1];v.push(px+side*(45+random(i,j)*65),py-45+random(i,j+9)*90,x-side*(45+random(i,j+17)*60),y+side*(30+random(i,j+27)*54),x+(random(i,j+37)-.5)*76,y+(random(i,j+47)-.5)*48);});
 }else{
  const flyaways=[
   [553,186,578,119,529,109,494,100,551,54,594,83,642,130,376,182,327,141,279,101,257,64,222,94,182,126,252,196,289,165,338,129,382,235,455,224,502,214,526,281,594,291,686,308,677,344,724,327],
   [565,173,560,298,454,289,374,284,362,173,316,187,267,196,258,278,225,277,167,273,151,215,171,204,186,189,210,221,181,241,153,263,125,252,123,214,122,176,199,176,265,238,325,286,534,324,583,348],
   [553,230,624,173,586,141,546,95,595,49,633,82,683,141,533,192,392,158,327,144,348,249,295,239,244,228,276,168,237,151,206,131,161,145,165,166,172,210,227,191,249,190,297,189,329,301,379,286]
  ];v.push(...flyaways[i-strandCount]);
 }
 return v;
});
const hairRest=[97,121,98,110,105,111,107,105,116,109,121,103,128,109,139,106,141,112,151,111,148,120];
const hairPanic=[97,121,83,76,104,108,100,60,116,105,124,52,129,105,148,63,142,109,166,83,148,120];
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)},mix=(a,b,t)=>a+(b-a)*t;
const preference=matchMedia('(prefers-reduced-motion: reduce)');let playing=!preference.matches,elapsed=preference.matches?10500:0,previous=null,raf;
function draw(ms){
 const t=Math.floor((ms%15000)/1000*12)/12,order=ease((t-6.4)/2.6),reset=ease((t-13.8)/1.2),neat=order*(1-reset),insert=ease((t-4.2)/1.7)*(1-reset);
 $('bos').setAttribute('transform',`translate(0,${-157*(1-insert)}) rotate(${(1-insert)*-9} 461 142)`);
 $('bos').style.opacity=clamp(insert*8);
 $('scene-heading').style.opacity=1-ease((insert-.32)/.12)*(1-ease((insert-.9)/.1));
 $('lamp').setAttribute('fill',insert>.99?'#f0e5ce':'#503620');$('spark').style.opacity=(t>5.9&&t<6.5)?Math.sin((t-5.9)/.6*Math.PI):0;
 $('code').style.opacity=ease((neat-.65)/.35);$('loose-code').style.opacity=1-ease(neat*2);
 $('caption').textContent=t<4.2?'Big ideas. A little spaghetti.':t<8.8?'Enter BOS. Plug in a little perspective.':t<13.8?'Same imagination. A little more order.':'And so, the next bright idea…';
 const panic=ease((t-.7)/1.7)*(1-ease((neat-.05)/.65))*(1-reset);
 const hair=hairRest.map((n,j)=>mix(n,hairPanic[j]+(j%2===0?Math.sin(t*6+j)*1.2:0),panic));
 $('hair').setAttribute('d',`M${hair[0]} ${hair[1]} L${hair.slice(2).join(' ')}Z`);
 $('alarm').style.opacity=panic*.8;
 $('mouth').setAttribute('d',panic>.5?'M139 171q4-9 10-3':'M139 166q7 2 11-3');
 const speed=neat>.8?7:16,beat=Math.sin(t*speed);
 $('arm1').setAttribute('transform',`translate(0 ${beat*2})`);$('arm2').setAttribute('transform',`translate(0 ${-beat*2})`);$('head').setAttribute('transform',`rotate(${Math.sin(t*speed/2)*.8} 120 190)`);$('carriage').setAttribute('transform',`translate(${(t*9%12)-6} 0)`);$('crank').setAttribute('transform',`translate(0 ${Math.sin(t*5)*4})`);
 paths.forEach((p,i)=>{
  const fly=i>=strandCount,target=141+(i%strandCount)*18,growth=mix(.28+.72*ease(t/2.1),.28,reset);
  // Flyaways withdraw during the plug's entrance, leaving its approach legible.
  const settle=fly?Math.max(neat,ease((t-4)/2.2)*(1-reset)):neat;
  const tidy=[508,208+i%5*2];
  for(let c=0;c<curveCount;c++)for(let k=1;k<=3;k++){const f=(c*3+k)/(curveCount*3);tidy.push(508+310*f,mix(208+i%5*2,target,ease(f*3)));}
  const v=tangles[i].map((n,j)=>{
   if(j<2)return n;
   const origin=j%2?210:508,flutter=Math.sin(t*(fly?1.8:2.6)+j*.8+i*2.1)*(j%2?4:2);
   return mix(origin+(n-origin)*growth+flutter*(1-neat),tidy[j],settle);
  });
  let d=`M${v[0]} ${v[1]}`;for(let c=0;c<curveCount;c++)d+=` C${v.slice(2+c*6,8+c*6).join(' ')}`;
  p.setAttribute('d',d);p.setAttribute('opacity',fly?.64*(1-settle):1-neat*.87);
 });
}
function tick(now){if(previous!==null)elapsed+=Math.min(now-previous,100);previous=now;draw(elapsed);if(playing)raf=requestAnimationFrame(tick);}
function update(){cancelAnimationFrame(raf);previous=null;$('toggle').textContent=playing?'Pause':'Play';$('toggle').setAttribute('aria-label',playing?'Pause animation':'Play animation');draw(elapsed);if(playing)raf=requestAnimationFrame(tick);}
$('toggle').addEventListener('click',()=>{playing=!playing;update();});
preference.addEventListener('change',e=>{playing=!e.matches;if(e.matches)elapsed=10500;update();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);previous=null;}else if(playing){previous=null;raf=requestAnimationFrame(tick);}});
update();
</script></body></html>
