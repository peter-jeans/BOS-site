name: BOS guided install native qualification
on:
  push:
    branches: [codex/bos-guided-install-20261026]
    paths:
      - 'qa/guided-install/**'
      - 'qa/runtime-cache/**'
      - '.github/workflows/bos-guided-install-native.yml'
permissions:
  contents: read
concurrency:
  group: bos-guided-install-native-qualification
  cancel-in-progress: false
jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Read the exact public qualification commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use a pinned test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify the distributable Windows runtime before executing it
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'bos-node-v24.22.1-win-x64.zip'
          Invoke-WebRequest 'https://nodejs.org/download/release/v24.22.1/node-v24.22.1-win-x64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5') { throw 'Official Node archive differs from pinned checksum' }
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'BOS Verified Runtime'
          Expand-Archive $zip -DestinationPath $runtimeRoot
          $node = Join-Path $runtimeRoot 'node-v24.22.1-win-x64/node.exe'
          if ((Get-FileHash $node -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5') { throw 'Node executable differs from pinned payload' }
          $signature = Get-AuthenticodeSignature $node
          if ($signature.Status -ne 'Valid') { throw "Node publisher signature status: $($signature.Status)" }
          $sourceSubset = Join-Path $env:RUNNER_TEMP 'BOS Runtime Source'
          New-Item -ItemType Directory -Path $sourceSubset | Out-Null
          Copy-Item $node (Join-Path $sourceSubset 'node.exe')
          Copy-Item (Join-Path $runtimeRoot 'node-v24.22.1-win-x64/LICENSE') (Join-Path $sourceSubset 'LICENSE')
          "BOS_RUNTIME_TEST_VENDOR_ROOT=$sourceSubset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'BOS_RUNTIME_TEST_PROFILE=win32-x64' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = & $node --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'v24.22.1') { throw 'Pinned runtime version probe failed' }
          Write-Output ('BOS_VENDOR_RUNTIME_RESULT ' + (@{platform='win32';architecture='x64';version=$version;archive_sha256='d2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5';binary_sha256='d702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5';signature_status=$signature.Status.ToString();signer_subject=$signature.SignerCertificate.Subject;installed_systemwide=$false} | ConvertTo-Json -Compress))
      - name: Install the pinned vendor CLI in the disposable runner
        shell: pwsh
        run: |
          $vendorPrefix = Join-Path $env:RUNNER_TEMP 'BOS Vendor Tools'
          npm install --prefix $vendorPrefix --no-audit --no-fund @openai/codex@0.163.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeCandidates = @(Get-ChildItem (Join-Path $vendorPrefix 'node_modules/@openai') -Recurse -Filter codex.exe | Where-Object { $_.FullName -match 'x86_64-pc-windows-msvc' })
          if ($nativeCandidates.Count -ne 1) { throw 'One exact native Windows x64 Codex executable required' }
          "BOS_TEST_CODEX=$($nativeCandidates[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify and stage the exact private setup CLI
        shell: pwsh
        run: |
          if ((Get-FileHash $env:BOS_TEST_CODEX -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2692c8c7bb2cf8b0aefe638741fc90236f4b824c59578ce84994f9de58200993') { throw 'CLI executable differs from pinned public package' }
          $signature = Get-AuthenticodeSignature $env:BOS_TEST_CODEX
          if ($signature.Status -notin @('Valid','NotSigned')) { throw "Unexpected CLI signature status: $($signature.Status)" }
          $cliSource = Join-Path $env:RUNNER_TEMP 'BOS Setup CLI Source'
          New-Item -ItemType Directory -Path $cliSource | Out-Null
          Copy-Item $env:BOS_TEST_CODEX (Join-Path $cliSource 'codex.exe')
          Copy-Item qa/runtime-cache/licenses/codex/LICENSE (Join-Path $cliSource 'LICENSE')
          Copy-Item qa/runtime-cache/licenses/codex/NOTICE (Join-Path $cliSource 'NOTICE')
          "BOS_SETUP_CLI_TEST_VENDOR_ROOT=$cliSource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'BOS_SETUP_CLI_TEST_PROFILE=win32-x64' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output ('BOS_VENDOR_CLI_RESULT ' + (@{platform='win32';architecture='x64';version='0.163.0';binary_sha256='2692c8c7bb2cf8b0aefe638741fc90236f4b824c59578ce84994f9de58200993';signature_status=$signature.Status.ToString();signer_subject=$signature.SignerCertificate.Subject;installed_systemwide=$false} | ConvertTo-Json -Compress))
      - name: Verify the private CLI cache with the real vendor payload
        shell: pwsh
        run: |
          node --test qa/runtime-cache/scripts/test_cloudbos_setup_cli.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install with private dependencies and no system CLI on PATH
        shell: pwsh
        run: |
          node qa/runtime-cache/scripts/qualify_cloudbos_setup_dependencies.mjs --runtime-source "$env:BOS_RUNTIME_TEST_VENDOR_ROOT" --cli-source "$env:BOS_SETUP_CLI_TEST_VENDOR_ROOT" --qualifier qa/guided-install/scripts/qualify_cloudbos_guided_native.mjs --setup qa/guided-install/installers/cloudbos-setup --bundle qa/guided-install/package --output (Join-Path $env:RUNNER_TEMP 'bos-private-dependency-receipt.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify user-level installation without a customer project
        shell: pwsh
        run: |
          node qa/runtime-cache/scripts/qualify_cloudbos_desktop_install.mjs --runtime-source "$env:BOS_RUNTIME_TEST_VENDOR_ROOT" --cli-source "$env:BOS_SETUP_CLI_TEST_VENDOR_ROOT" --setup qa/guided-install/installers/cloudbos-setup --bundle qa/guided-install/package --output (Join-Path $env:RUNNER_TEMP 'bos-desktop-host-stage-receipt.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify fail-closed approval and transport controls
        shell: pwsh
        run: |
          node --test qa/guided-install/scripts/test_cloudbos_setup_codex_native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the private runtime cache with the real signed vendor payload
        shell: pwsh
        run: |
          node --test qa/runtime-cache/scripts/test_cloudbos_setup_runtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify pinned-runtime hook bootstraps without system Node
        shell: pwsh
        run: |
          node --test qa/runtime-cache/scripts/test_cloudbos_setup_bootstrap.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test genuine native installation and untrusted-hook hold
        shell: pwsh
        run: |
          node qa/guided-install/scripts/qualify_cloudbos_guided_native.mjs --codex "$env:BOS_TEST_CODEX" --setup qa/guided-install/installers/cloudbos-setup --bundle qa/guided-install/package --output (Join-Path $env:RUNNER_TEMP 'bos-native-receipt.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
